name: Generate PDF CV

on:
  push:
    branches: [ main ]
    paths:
      - 'CV.md'
      - 'style.css'
      - 'generate-pdf.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate PDF and HTML
        run: npm run build

      - name: Commit and push updated PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zachary_Powell_CV.pdf CV.html
          if git diff --staged --quiet; then
            echo "No changes in generated PDF."
          else
            git commit -m "Auto-generate PDF and HTML [skip ci]"
            git push
          fi
